{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Agenda Clínica</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<style>

body{

background:#f4f6f9;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

}

.card{

width:420px;

border:none;

border-radius:15px;

box-shadow:0 0 25px rgba(0,0,0,.15);

}

.logo{

text-align:center;

padding-top:30px;

}

.logo img{

width:90px;

}

.btn-success{

background:#198754;

border:none;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="{% static 'img/logo.png' %}" alt="Logo">

<h3 class="mt-3">

Agenda Clínica

</h3>

</div>

<div class="card-body p-4">

{% if erro %}

<div class="alert alert-danger">

{{ erro }}

</div>

{% endif %}

<form method="post">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Usuário

</label>

<input

type="text"

name="usuario"

class="form-control"

required>

</div>

<div class="mb-3">

<label class="form-label">

Senha

</label>

<input

type="password"

name="senha"

class="form-control"

required>

</div>

<div class="d-grid">

<button class="btn btn-success btn-lg">

<i class="bi bi-box-arrow-in-right"></i>

Entrar

</button>

</div>

</form>

<hr>

<div class="text-center text-muted">

Sistema Agenda Clínica

<br>

v1.0

</div>

</div>

</div>

</body>

</html>
