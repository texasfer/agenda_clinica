<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Agenda Clínica</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- <link rel="stylesheet" href="/static/css/style.css"> -->

</head>
<body>

{% if messages %}
<div class="container-fluid mt-2">

    {% for message in messages %}

    <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm">

        {{ message }}

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>

    {% endfor %}

</div>
{% endif %}
<nav class="navbar navbar-dark bg-success">

<div class="container-fluid">

<a class="navbar-brand">

Agenda Clínica

</a>

<div>

{{ request.user.get_full_name }}

<a href="{% url 'logout' %}" class="btn btn-light btn-sm ms-3">

Sair

</a>

</div>

</div>

</nav>

<div class="container-fluid">

<div class="row">

<div class="col-2 bg-light vh-100 pt-3">

<div class="list-group">

<a href="{% url 'dashboard' %}" class="list-group-item">

🏠 Dashboard

</a>

<a href="/clientes/" class="list-group-item">

👥 Clientes

</a>

<a href="/agenda/" class="list-group-item">

📅 Agenda

</a>

<a href="/atendimento/" class="list-group-item">

🩺 Atendimento

</a>

<a href="/financeiro/" class="list-group-item">

💰 Financeiro

</a>

<a href="/relatorios/" class="list-group-item">

📊 Relatórios

</a>

<a href="/configuracoes/" class="list-group-item">

⚙ Configurações

</a>

</div>

</div>

<div class="col-10 p-4">

{% block content %}

{% endblock %}

</div>

</div>

</div>

</body>

</html>
